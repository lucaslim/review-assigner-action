name: "Review Assigner Action"
description: "Request reviews from GitHub team members by current review load"
author: "Lucas L."

inputs:
  token:
    description: "GitHub App token with Pull requests write, Issues write, Contents read, and organization Members read"
    required: true
  label:
    description: "Label that triggers review assignment"
    default: "needs-review"
  config-path:
    description: "Path to the YAML rotation config on the PR branch"
    default: ".github/review-assigner.yml"

outputs:
  reviewers:
    description: "Comma-separated requested logins, or empty when nobody is requested"

runs:
  using: "node24"
  main: "build/index.js"
